name: Android APK and offline voice bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Download and package Russian male TTS model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voice-package
          curl --fail --location --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-dmitri-medium.tar.bz2 \
            --output /tmp/russian-voice.tar.bz2
          tar -xjf /tmp/russian-voice.tar.bz2 -C voice-package
          test -n "$(find voice-package -name '*.onnx' -type f -print -quit)"
          test -n "$(find voice-package -name 'tokens.txt' -type f -print -quit)"
          cat > voice-package/INTEGRATION.txt <<'EOF'
          Jarvis Offline: Russian male TTS voice bundle
          Model: Piper ru_RU-dmitri-medium, converted for sherpa-onnx
          Runtime: sherpa-onnx TTS (Android native/JNI runtime required)
          This bundle contains model data, not a standalone executable and not the runtime.
          It generates speech locally after the app integrates the sherpa-onnx Android API.
          Check upstream model and runtime licenses before redistribution.
          Model source: https://huggingface.co/rhasspy/piper-voices/tree/main/ru/ru_RU/dmitri/medium
          Converted bundle: https://github.com/k2-fsa/sherpa-onnx/releases/tag/tts-models
          EOF
          cd voice-package
          zip -qr ../jarvis-russian-male-voice.zip .
      - name: Upload separate voice model bundle
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-russian-male-voice
          path: jarvis-russian-male-voice.zip
          if-no-files-found: error
          retention-days: 30
